# 黒刷り様式（jp-marriage-registration-black.pdf）向けのサンプル設定です。
# 描画位置はすべて src/layout/black.yaml にあるため、このファイルには記入内容のみを書きます。
# config.yaml の `*_pos` キーは赤刷り様式に合わせた値で、この様式の枠からずれるため、ここには含めません。
# Sample configuration for the black template (jp-marriage-registration-black.pdf).
# Every drawing position lives in src/layout/black.yaml, so this file holds only the information itself.
# Unlike config.yaml, it has no `*_pos` keys, because those values are tuned for the red template and would move the fields off this form's grid.
template: black

notification:
  year: 3
  month: 5
  day: 5
  to: 東京都小金井市

husband:
  last_name: 山田
  last_name_kana: やまだ
  first_name: 太郎
  first_name_kana: たろう
  # この様式は□昭和□平成の元号チェックボックスを印字します。
  # 設定からはチェックを付けられないため、元号は birth_year に文字として書き込みます。
  # This form prints □昭和□平成 era checkboxes.
  # The config cannot tick them, so birth_year writes the era as text in the space left beside them.
  birth_year: 平成５
  birth_month: ５
  birth_day: ２１
  address_first: 東京都千代田区神田
  address_second: ３丁目　４
  is_banchi_address: false
  address_go: １０
  # 3行までであれば崩れず表現できます。
  # Up to three lines render without overlapping.
  address_apartment: |
    インチキタワー
    マンション
    ３６１０号室
  household_person: 山田　太郎
  legally_domiciled_first: 東京都千代田区飯田橋
  legally_domiciled_second: ３丁目　４
  is_banchi_legally_domiciled: true
  head_of_person_of_legally_domiciled: 山田　太郎兵衛
  # この様式には養父・養母の行もありますが、対応する設定項目がないため空欄のまま印刷され、手書きで記入します。
  # The 養父/養母 rows have no config keys and print blank for handwriting.
  father_name: 山田　権左衛門
  mother_name: 山田　としこ
  relationship: 長
  marital_history:
    # 0: 初婚、1: 死別、2: 離別
    # 0: first marriage, 1: widowed, 2: divorced
    marriage_cat: 2
    year: 令和3
    month: 6
    day: 1
  job_type: 6

wife:
  last_name: 貫井
  last_name_kana: ぬくい
  first_name: はゆ
  first_name_kana: はゆ
  birth_year: 平成7
  birth_month: 6
  birth_day: 6
  address_first: 東京都小金井市貫井北町
  address_second: ３丁目　４
  is_banchi_address: false
  address_go: １０
  # 空欄のまま印刷する場合は '' を使用します。
  # Use '' to leave the box blank on the printout.
  address_apartment: ''
  household_person: 貫井　パッパ
  legally_domiciled_first: 神奈川県横浜市
  legally_domiciled_second: ３丁目　４
  is_banchi_legally_domiciled: true
  head_of_person_of_legally_domiciled: 貫井　パッパ
  father_name: 貫井　パッパ
  mother_name: 貫井　はよ
  relationship: 長
  marital_history:
    # 0: 初婚、1: 死別、2: 離別
    # 0: first marriage, 1: widowed, 2: divorced
    marriage_cat: 0
    year: 令和３
    month: ６
    day: １
  job_type: 4

new_legally_domiciled:
  # husband または wife を指定します。
  # 外国人との婚姻の場合は、null にすると氏の選択欄が空欄になります。
  # Set husband or wife.
  # In a marriage with a foreign national, set null to leave the surname choice blank.
  lastname_of: husband

  address: 東京都小金井市貫井北町１丁目１
  is_banchi_address: false

to_live_together:
  year: 令和3
  month: 6

# 国勢調査の年の4月1日から翌年3月31日までに届け出る場合のみ記入します。
# それ以外の場合は year を空文字 '' にすると、この欄全体が空欄になります。
# Fill this in only when filing between April 1 of a national census year and March 31 of the following year.
# Otherwise, set year to an empty string '' to leave the whole section blank.
national_census:
  year: 令和3
  husband_job: '03'
  wife_job: '02'

# 旧字体と新字体の変更などに使用します。
# Use this for notes such as a change between old and new kanji forms.
other:
  text: ''

# 証人欄です。
# witness1 が左、witness2 が右の列です。
# 証人に手書きしてもらう場合は、セクションごと削除（またはコメントアウト）するとその列全体が空欄になります。
# Witness box.
# witness1 is the left column and witness2 the right one.
# Remove (or comment out) a whole section to leave that column blank for handwriting.
witness1:
  # 署名は必ず証人本人の自署が必要です。
  # 通常は '' のままにして、印刷後に署名してもらってください。
  # The signature must be handwritten by the witness, so leave name as '' and have them sign the printout.
  name: ''
  birth_year: 昭和６０
  birth_month: １
  birth_day: ２３
  address_first: 東京都新宿区西新宿
  # この様式の証人の住所欄には、番地・番・号が印字されていません。
  # そのため、番地と号は address_second にまとめ、address_go は空、is_banchi_address は null にして印を付けません。
  # The witness 住所 row prints no 番地/番/号 on this form.
  # Fold them into address_second instead, leave address_go empty, and set is_banchi_address to null so no mark is drawn.
  address_second: ２丁目　８番１号
  is_banchi_address: null
  address_go: ''
  # 方書（建物名・部屋番号）です。
  # 住所の下の行の右端に3行まで書けます。
  # This is the building and room (方書).
  # Up to three lines fit at the right end of the lower 住所 line.
  address_apartment: ''
  # 外国籍の証人は国籍のみを記入し、is_banchi_legally_domiciled を null にします。
  # A foreign witness writes only their nationality here, with is_banchi_legally_domiciled set to null.
  legally_domiciled_first: 東京都新宿区西新宿
  legally_domiciled_second: ２丁目　８
  is_banchi_legally_domiciled: true

witness2:
  name: ''
  birth_year: 平成２
  birth_month: １１
  birth_day: ３
  address_first: 神奈川県横浜市中区日本大通
  address_second: １丁目　１番２号
  is_banchi_address: null
  address_go: ''
  address_apartment: |
    サンプル
    ハイツ
    ２０１
  legally_domiciled_first: 神奈川県横浜市中区日本大通
  legally_domiciled_second: １丁目　１
  is_banchi_legally_domiciled: true
