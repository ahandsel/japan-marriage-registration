# 黒刷り様式（jp-marriage-registration-black.pdf）のレイアウトです。
# 描画する項目はすべて絶対位置で指定し、他の項目の位置から計算するものはありません。
# 座標は用紙の左下を原点とする PDF ポイントで、`pos` はテキストのベースラインの [x, y] です。
# `size` はフォントサイズ（ポイント）、`step` は複数行の項目の行間です。
# 円は [x, y, r]、楕円は外接矩形の対角の2点 [x1, y1, x2, y2] です。
# Layout for the "black" template (jp-marriage-registration-black.pdf).
# Every drawn item has an absolute position; nothing is derived from another field.
# Coordinates are PDF points measured from the bottom-left corner, and `pos` is the [x, y] of the text baseline.
# `size` is the font size in points, and `step` is the distance between lines of a multi-line field.
# Circles are [x, y, r]; ellipses are two opposite bounding-box corners [x1, y1, x2, y2].
#
# 以下はテンプレートから実測したこの様式の枠です。
# 夫と妻の列は幅185.5pt で、妻の位置は夫の対応する位置に185.7を足した値です。
# ただし、世帯のおもな仕事の ✓ は夫と妻で1つの列を共有するため、妻の位置は夫の位置に32.5を足した値です。
# 証人の列は幅184.5pt で、証人2の位置は証人1の位置に184.3を足した値です。
# Grid of this form, measured from the template itself.
# The husband and wife columns are 185.5pt wide, so every wife position is its husband counterpart plus 185.7.
# The one exception is the household_work_type ✓, where 夫 and 妻 share one column, so each wife ✓ is its husband counterpart plus 32.5.
# The witness columns are 184.5pt wide, so witness2 is witness1 plus 184.3.
#   label column     x 127.3-209.5    husband  x 209.5-395.0
#   wife column      x 395.0-580.8    witness1 x 694.0-878.5
#   witness2 column  x 878.5-1062.5
# 行の罫線（夫の列、上から順）：
# Row lines (husband column, top to bottom):
#   682.0-662.0 header, 662.0-651.0 よみかた, 651.0-618.5 氏名, 618.5-602.0 生年月日,
#   602.0-522.5 住所 (dashed at 578.5 and 545.0), 522.5-452.5 本籍 (dashed at 498.5 and 475.0),
#   452.5-381.5 父母及び養父母 (434.5, 417.0, 399.5), 381.5-336.0 新本籍, 336.0-310.5 同居を始めたとき,
#   310.5-285.0 初婚・再婚, 285.0-203.0 世帯のおもな仕事, 203.0-174.5 夫妻の職業, 174.5-123.0 その他
#
# ⚠️ この様式は赤刷り様式より枠が細かく、設定項目のない欄も印字されているため、他のレイアウトと次の点が異なります。
# ⚠️ This form is tighter than the "red" one and prints boxes that the config has no keys for, so a few things differ from the other layouts:
#   * 氏名の枠は高さ約33pt、よみかたの帯は約11pt です（赤刷り様式はそれぞれ約37pt と約15pt）。
#     そのため氏名は24ではなく18、よみかたは12ではなく9の大きさで描画します。
#     The 氏名 cell is about 33pt tall and the よみかた strip about 11pt (red's are about 37pt and 15pt).
#     So names are drawn at size 18 rather than 24, and kana at size 9 rather than 12.
#   * 生年月日の欄には年の前に□昭和□平成の元号チェックボックスが印字され、年の枠の大部分を占めています。
#     これらのチェックボックスは設定から付けられないため、birth_year は残りの空きに元号を文字として書きます（ここでは大きさ11、幅の狭い証人の列では7.5）。
#     生年月日 prints □昭和□平成 era checkboxes ahead of the year, which take up most of the year cell.
#     Those boxes cannot be ticked from the config, so `birth_year` still writes the era as text in the space that is left (size 11 here, size 7.5 in the narrower witness columns).
#   * 証人の住所の行には、証人の本籍の行や赤刷り様式と違い、番地・番・号が印字されていません。
#     下の address_go と住所の2つの図形は手書きの番地・番が入る位置に置いてあるため、この様式では証人の address_banchi_type を null にして印を省き、番地と号は address_banchi にまとめてください。
#     The witness 住所 row prints no 番地/番/号 marks, unlike the witness 本籍 row and unlike the red form.
#     `address_go` and the two 住所 shapes below are placed where a handwritten 番地/番 would go, so set a witness's `address_banchi_type` to `null` on this template to skip the mark, and fold the 番地/号 into `address_banchi`.
#   * 次の印字欄には設定項目がなく、空欄のまま残ります：住所の□同右・□同左、世帯主の□同右・□同左、養父・養母の行、同居を始めたときの□平成・□令和と□未同居・未挙式、□新本籍は街区符号、□新戸籍の表示確認済、届出人署名、下部の事件簿番号・住所を定めた年月日・連絡先の欄。
#     These printed boxes have no config keys and stay blank: the □同右/□同左 address shortcuts, 世帯主 □同右/□同左, the 養父/養母 rows, □平成/□令和 and □未同居・未挙式 in 同居を始めたとき, □新本籍は街区符号, □新戸籍の表示確認済, 届出人署名, and the bottom 事件簿番号 / 住所を定めた年月日 / 連絡先 block.
husband:
  last_name: { pos: [213, 622], size: 18 }
  last_name_kana: { pos: [213, 653.5], size: 9 }
  # 氏と名の枠は x 302 の点線で分かれています。
  # The 氏/名 cells are split by a dashed line at x 302.
  first_name: { pos: [305, 622], size: 18 }
  first_name_kana: { pos: [305, 653.5], size: 9 }
  # 印字の年・月・日は x 289.0/330.4/371.9 から始まり、ベースラインは 605 です。
  # これらは x 237.2 で終わる□昭和□平成のチェックボックスの後ろにあります。
  # The printed 年/月/日 start at x 289.0/330.4/371.9 on baseline 605.
  # They come after the □昭和□平成 boxes, which end at x 237.2.
  birth_year: { pos: [241, 605], size: 11 }
  birth_month: { pos: [305, 605], size: 11 }
  birth_day: { pos: [347, 605], size: 11 }
  # 住所の1行目は、印字の□同右（x 237.1 まで）の右から始まります。
  # Line 1 of 住所 starts right of the printed □同右 box, which ends at x 237.1.
  address_town: { pos: [243, 583.5], size: 11 }
  address_banchi: { pos: [215, 567], size: 11 }
  address_go: { pos: [332, 557], size: 11 }
  # 世帯主の□同右（x 272.3 まで）の右、「の氏名」の行に書きます。
  # This goes right of 世帯主 □同右 (which ends at x 272.3), on the の氏名 line.
  head_of_household: { pos: [277, 525], size: 11 }
  # 印字の（方書）の右に書きます（ラベルは x 250.1 まで）。
  # 番・号の行から y 545 の点線までの間に、大きさ5の行が3行入ります。
  # This goes right of the printed （方書） label, which ends at x 250.1.
  # Three 5pt lines fit between the 番/号 line and the dashed row bottom at y 545.
  address_building: { pos: [253, 556], size: 5, step: 4.5 }
  # address_banchi_type が banchi のときは印字の番地（x 314.1-332.5）を楕円で、ban のときは番（x 314.1-323.3）を円で囲みます。
  # Drawn when address_banchi_type is banchi (ellipse around the printed 番地 at x 314.1-332.5) or ban (circle around 番 at x 314.1-323.3).
  address_banchi_ellipse: [338, 581, 308, 564]
  address_ban_circle: [318.7, 561.7, 8]
  domicile_town: { pos: [213, 503], size: 11 }
  domicile_banchi: { pos: [215, 488], size: 11 }
  head_of_family_register: { pos: [247, 456], size: 11 }
  domicile_banchi_ellipse: [359.6, 501.3, 329.6, 484.3]
  domicile_ban_circle: [340, 482.2, 8]
  # 父と母は4行のうち上の2行です。
  # その下の養父・養母の行（y 417.0-381.5）には設定項目がなく、空欄のまま残ります。
  # 父 and 母 are the first two of four rows.
  # The 養父/養母 rows below them (y 417.0-381.5) have no config keys and stay blank.
  father_name: { pos: [233, 439], size: 11 }
  mother_name: { pos: [233, 421.5], size: 11 }
  # 続き柄の枠（x 344.5-395.0）の、印字の男の左に書きます。
  # This is the 続き柄 cell, x 344.5-395.0, left of the printed 男.
  relationship_to_parents: { pos: [356, 424], size: 11 }
  marital_history:
    first_marriage_check: { pos: [216.5, 290.5], size: 9 }
    widowed_check: { pos: [279.5, 299], size: 9 }
    divorced_check: { pos: [279.5, 289], size: 9 }
    year: { pos: [306, 292], size: 6 }
    month: { pos: [337, 292], size: 6 }
    day: { pos: [365, 292], size: 6 }
  # household_work_type の値（1-6）ごとに ✓ の位置を1つ持ちます。
  # ✓ が「夫」の字に重ならないよう、印字の夫の枠（x 215.0-239.0）の右半分に置きます。
  # One ✓ position per household_work_type value (1-6).
  # Each ✓ sits in the right half of the printed 夫 box (x 215.0-239.0), so it clears the 夫 character.
  household_work_type_checks:
    size: 9
    positions:
      1: [229, 272.5]
      2: [229, 263]
      3: [229, 254]
      4: [229, 235.5]
      5: [229, 217]
      6: [229, 208]

wife:
  last_name: { pos: [398.7, 622], size: 18 }
  last_name_kana: { pos: [398.7, 653.5], size: 9 }
  first_name: { pos: [490.7, 622], size: 18 }
  first_name_kana: { pos: [490.7, 653.5], size: 9 }
  birth_year: { pos: [426.7, 605], size: 11 }
  birth_month: { pos: [490.7, 605], size: 11 }
  birth_day: { pos: [532.7, 605], size: 11 }
  address_town: { pos: [428.7, 583.5], size: 11 }
  address_banchi: { pos: [400.7, 567], size: 11 }
  address_go: { pos: [517.7, 557], size: 11 }
  head_of_household: { pos: [462.7, 525], size: 11 }
  address_building: { pos: [438.7, 556], size: 5, step: 4.5 }
  address_banchi_ellipse: [523.7, 581, 493.7, 564]
  address_ban_circle: [504.4, 561.7, 8]
  domicile_town: { pos: [398.7, 503], size: 11 }
  domicile_banchi: { pos: [400.7, 488], size: 11 }
  head_of_family_register: { pos: [432.7, 456], size: 11 }
  domicile_banchi_ellipse: [545.3, 501.3, 515.3, 484.3]
  domicile_ban_circle: [525.7, 482.2, 8]
  father_name: { pos: [418.7, 439], size: 11 }
  mother_name: { pos: [418.7, 421.5], size: 11 }
  # 続き柄の枠（x 530.0-580.8）の、印字の女の左に書きます。
  # This is the 続き柄 cell, x 530.0-580.8, left of the printed 女.
  relationship_to_parents: { pos: [541.7, 424], size: 11 }
  marital_history:
    first_marriage_check: { pos: [402.2, 290.5], size: 9 }
    widowed_check: { pos: [465.2, 299], size: 9 }
