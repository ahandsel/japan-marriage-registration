  # 印字の妻の枠（x 247.5-271.5）の右半分に置きます。
  # Each ✓ sits in the right half of the printed 妻 box, x 247.5-271.5.
  household_work_type_checks:
    size: 9
    positions:
      1: [261.5, 272.5]
      2: [261.5, 263]
      3: [261.5, 254]
      4: [261.5, 235.5]
      5: [261.5, 217]
      6: [261.5, 208]

# 証人欄は用紙の右上にあり、証人1は x 694-878.5、証人2は x 878.5-1062.5（184.3pt ずれ）、行は y 483-661.5 です。
# 行の罫線は、661.5-622.5 署名、622.5-598.5 生年月日、598.5-543.0 住所（571.5 に点線）、543.0-483.0 本籍（516.0 に点線）です。
# 署名の行は、設定で `name` を指定しない限り手書き用に空欄のままです。
# 証人 (witnesses) box, top right of the form: x 694-878.5 for witness 1 and x 878.5-1062.5 for witness 2 (a 184.3pt offset), rows y 483-661.5.
# Row lines: 661.5-622.5 署名, 622.5-598.5 生年月日, 598.5-543.0 住所 (dashed at 571.5), 543.0-483.0 本籍 (dashed at 516.0).
# The 署名 row is left for a handwritten signature unless `name` is set in the config.
witness1:
  # 印字の印（x 861.0-870.2）の左に書きます。
  # This goes left of the printed 印, which sits at x 861.0-870.2.
  name: { pos: [700, 638.5], size: 13 }
  # 印字の年・月・日は x 760.2/815.0/861.9 から始まり、ベースラインは 605.5 です。
  # □昭和□平成のチェックボックスは x 728.5 で終わるため、元号と年に使えるのは約30pt です。
  # The printed 年/月/日 start at x 760.2/815.0/861.9 on baseline 605.5.
  # The □昭和□平成 boxes end at x 728.5, which leaves about 30pt for the era and year.
  birth_year: { pos: [730, 605.5], size: 7.5 }
  birth_month: { pos: [776, 605.5], size: 11 }
  birth_day: { pos: [830, 605.5], size: 11 }
  address_town: { pos: [698, 576.5], size: 11 }
  address_banchi: { pos: [698, 549], size: 11 }
  # この行には番地・番・号が印字されていないため、下の3項目は手書きで書く場合の位置を示します。
  # 詳しくは冒頭の注記を参照してください。
  # This row prints no 番地/番/号, so the three items below mark where a handwritten one would go.
  # See the header note.
  address_go: { pos: [840, 549], size: 11 }
  # 方書の印字欄はないため、address_banchi にまとめた番地・号の後ろ、住所の下の行の右端（x 846-877、y 543-571.5）に書きます。
  # 5文字の行を3行まで書けます。
  # 方書 has no printed slot, so it takes the right end of the lower 住所 line (x 846-877, y 543-571.5), past the folded 番地/号 in address_banchi.
  # It holds up to three lines of five characters.
  address_building: { pos: [846, 565], size: 6, step: 7 }
  address_banchi_ellipse: [839.8, 561, 811.8, 545]
  address_ban_circle: [821.2, 549, 8]
  domicile_town: { pos: [698, 521.5], size: 11 }
  domicile_banchi: { pos: [698, 503], size: 11 }
  # 印字の番地は x 816.6-835.0、番は x 816.6-825.8 にあります。
  # The printed 番地 is at x 816.6-835.0, and 番 is at x 816.6-825.8.
  domicile_banchi_ellipse: [839.8, 515.9, 811.8, 499.9]
  domicile_ban_circle: [821.2, 496.6, 8]

witness2:
  name: { pos: [884.3, 638.5], size: 13 }
  birth_year: { pos: [914.3, 605.5], size: 7.5 }
  birth_month: { pos: [960.3, 605.5], size: 11 }
  birth_day: { pos: [1014.3, 605.5], size: 11 }
  address_town: { pos: [882.3, 576.5], size: 11 }
  address_banchi: { pos: [882.3, 549], size: 11 }
  address_go: { pos: [1024.3, 549], size: 11 }
  address_building: { pos: [1030.3, 565], size: 6, step: 7 }
  address_banchi_ellipse: [1024.1, 561, 996.1, 545]
  address_ban_circle: [1005.5, 549, 8]
  domicile_town: { pos: [882.3, 521.5], size: 11 }
  domicile_banchi: { pos: [882.3, 503], size: 11 }
  domicile_banchi_ellipse: [1024.1, 515.9, 996.1, 499.9]
  domicile_ban_circle: [1005.5, 496.6, 8]

# 婚姻後の夫婦の氏・新しい本籍の欄は y 381.5-336.0 です。
# 夫の氏・妻の氏のチェックボックスの列は x 209.5-255.0、新本籍の枠は x 255.0-580.8 です。
# 住所は、y 366-377 にある印字の注記（左の□の氏の人が…）の下に書きます。
# The 婚姻後の夫婦の氏・新しい本籍 box is y 381.5-336.0.
# The 夫の氏/妻の氏 checkbox column is x 209.5-255.0, and the 新本籍 cell is x 255.0-580.8.
# The address goes below the printed （左の□の氏の人が…） note, which fills y 366-377.
new_domicile:
  husband_surname_check: { pos: [215, 363], size: 9 }
  wife_surname_check: { pos: [215, 347.5], size: 9 }
  address: { pos: [262, 352], size: 13 }
  banchi_ellipse: [535.8, 365.6, 505.8, 348.6]
  ban_circle: [516.2, 346.5, 8]

# 印字の年・月は x 288.7/334.7 から始まり、ベースラインは 318.5 です。
# 左の□平成・□令和と右の□未同居・未挙式には設定項目がありません。
# The printed 年/月 start at x 288.7/334.7 on baseline 318.5.
# The □平成/□令和 boxes to the left and the □未同居・未挙式 box to the right have no config keys.
living_together_since:
  year: { pos: [250, 318.5], size: 11 }
  month: { pos: [305, 318.5], size: 11 }

# 国勢調査の年は、印字の注記の「（国勢調査の年…」（x 259.6 まで）と「年…の」（x 276.6 から）の間の空きに書きます。
# The 国勢調査 year drops into the gap in the printed note, between 「（国勢調査の年…」 (ends x 259.6) and 「年…の」 (starts x 276.6).
national_census:
  year: { pos: [261, 195.5], size: 5.5 }
  husband_job: { pos: [258, 180], size: 13 }
  wife_job: { pos: [443.7, 180], size: 13 }

filing:
  # 年・月・日の欄は約20ptしかなく、全角2桁（24pt）が入らないため、各欄の中央に揃え、2桁のときだけ文字を縮めます。
  # Each date slot is about 20pt wide, too narrow for two full-width digits (24pt), so each value is centered between its labels and shrunk only when it has two digits.
  year: { pos: [178.8, 735], size: 12, align: center, max_width: 19 }
  month: { pos: [208.5, 735], size: 12, align: center, max_width: 19 }
  day: { pos: [238.3, 735], size: 12, align: center, max_width: 19 }
  # x 238.3 から始まる印字の「長 殿」の左に書きます。
  # This goes left of the printed 長 殿, which starts at x 238.3.
  office: { pos: [152, 702.5], size: 11 }

# その他の欄は y 174.5-123.0 です。
# y 124.9-137.9 にある印字の□新本籍は街区符号・□新戸籍の表示確認済の行の上に、3行書けます。
# The その他 box is y 174.5-123.0.
# Three lines fit above the printed □新本籍は街区符号 / □新戸籍の表示確認済 row at y 124.9-137.9.
other:
  text: { pos: [152, 165], size: 11, step: 13 }
