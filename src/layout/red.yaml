# 証人欄は用紙の右上にあり、証人1は x 724-936、証人2は x 936-1148（212pt ずれ）です。
# 行は「証人」の見出し（y 635-657）の下の y 451-635 です。
# 署名の行は、設定で `name` を指定しない限り手書き用に空欄のままです。
# 証人 (witnesses) box, top right of the form: x 724-936 for witness 1 and x 936-1148 for witness 2 (a 212pt offset).
# Its rows are y 451-635, below the 証人 header (y 635-657).
# The 署名 row is left for a handwritten signature unless `name` is set in the config.
witness1:
  name: { pos: [734, 610], size: 14 }
  # 印字の年・月・日の中心は x 812/867/922 で、ベースラインは 579.4 です。
  # The printed 年/月/日 labels are centered at x 812/867/922 on baseline 579.4.
  birth_year: { pos: [744, 581], size: 12 }
  birth_month: { pos: [830, 581], size: 12 }
  birth_day: { pos: [886, 581], size: 12 }
  address_first: { pos: [730, 546], size: 12 }
  address_second: { pos: [730, 516], size: 12 }
  address_go: { pos: [854, 516], size: 12 }
  # 方書は印字の号の右の空き（x 902-936、y 509-539）に書きます。
  # 5文字の行を3行まで書けます。
  # 方書 goes in the free cell right of the printed 号 (x 902-936, y 509-539).
  # It holds up to three lines of five characters.
  address_apartment: { pos: [903, 530], size: 6, step: 7 }
  address_banchi_ellipse: [850, 536.5, 825, 523.5]
  address_go_circle: [832.5, 519, 6]
  legally_domiciled_first: { pos: [730, 487], size: 12 }
  legally_domiciled_second: { pos: [730, 457], size: 12 }
  legally_domiciled_banchi_ellipse: [887, 478, 862, 464]
  legally_domiciled_go_circle: [869.5, 460, 6]

