# 赤刷り様式（jp-marriage-registration-red.pdf）のレイアウトです。
# 描画する項目はすべて絶対位置で指定し、他の項目の位置から計算するものはありません。
# 座標は用紙の左下を原点とする PDF ポイントで、`pos` はテキストのベースラインの [x, y] です。
# `size` はフォントサイズ（ポイント）、`step` は複数行の項目の行間です。
# 円は [x, y, r]、楕円は外接矩形の対角の2点 [x1, y1, x2, y2] です。
# Layout for the "red" template (jp-marriage-registration-red.pdf).
# Every drawn item has an absolute position; nothing is derived from another field.
# Coordinates are PDF points measured from the bottom-left corner, and `pos` is the [x, y] of the text baseline.
# `size` is the font size in points, and `step` is the distance between lines of a multi-line field.
# Circles are [x, y, r]; ellipses are two opposite bounding-box corners [x1, y1, x2, y2].

husband:
  last_name: { pos: [220, 590], size: 24 }
  last_name_kana: { pos: [221, 623], size: 12 }
  first_name: { pos: [300, 590], size: 24 }
  first_name_kana: { pos: [305, 623], size: 12 }
  birth_year: { pos: [221, 569], size: 12 }
  birth_month: { pos: [300, 569], size: 12 }
  birth_day: { pos: [345, 569], size: 12 }
  address_first: { pos: [221, 545], size: 12 }
  address_second: { pos: [209, 524], size: 12 }
  address_go: { pos: [301, 524], size: 12 }
  household_person: { pos: [231, 501], size: 12 }
  address_apartment: { pos: [351, 532], size: 5, step: 5 }
  # is_banchi_address が true のときは番地を楕円で、false のときは番を円で囲みます。
  # Drawn when is_banchi_address is true (ellipse around 番地) or false (circle around 番).
  address_banchi_ellipse: [300, 539, 270, 528]
  address_go_circle: [279.5, 523, 6]
  legally_domiciled_first: { pos: [221, 480], size: 12 }
  legally_domiciled_second: { pos: [221, 459], size: 12 }
  head_of_person_of_legally_domiciled: { pos: [231, 436], size: 12 }
  legally_domiciled_banchi_ellipse: [346, 473, 316, 462]
  legally_domiciled_go_circle: [327, 457, 6]
  father_name: { pos: [221, 410], size: 12 }
  mother_name: { pos: [221, 380], size: 12 }
  relationship: { pos: [351, 385], size: 12 }
  marital_history:
    first_marriage_check: { pos: [196, 290], size: 12 }
    remarriage_death_check: { pos: [273, 295], size: 12 }
    remarriage_divorce_check: { pos: [273, 285], size: 12 }
    year: { pos: [301, 289], size: 6 }
    month: { pos: [338, 289], size: 6 }
    day: { pos: [365, 289], size: 6 }
  # job_type の値（1-6）ごとに ✓ の位置を1つ持ちます。
  # One ✓ position per job_type value (1-6).
  job_type_checks:
    size: 12
    positions:
      1: [210, 271]
      2: [210, 260]
      3: [210, 250]
      4: [210, 230]
      5: [210, 209]
      6: [210, 199]

