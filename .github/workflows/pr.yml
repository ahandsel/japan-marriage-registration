name: pr

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: create marriage registration
        # -o pins the output name: the local default is timestamped
        # (result-<template>-<HH-MM-SS>.pdf), but the artifact path is fixed.
        run: node src/main.js config.yaml -o result.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: marriage_registration
          path: result.pdf
