# 品川区のシナモロール様式（jp-marriage-registration-cinnamoroll.pdf）向けの
# サンプル設定です。 Sample configuration for the cinnamoroll template. Every
# drawing position lives in src/layout/cinnamoroll.yaml, so this file only
# holds the information itself - there are no `*_pos` keys, unlike
# config.yaml, whose values are tuned for the red template and would move the
# fields off this form's grid.
template: cinnamoroll

notification:
  year: 3
  month: 5
  day: 5
  # この様式は宛先が「品川区長殿」と印刷済みのため、届出先は空欄のままに
  # してください。 The recipient is pre-printed as 品川区長殿 on this form,
  # so leave the destination empty.
  to: ''

husband:
  last_name: 山田
  last_name_kana: やまだ
  first_name: 太郎
  first_name_kana: たろう
  birth_year: 平成５
  birth_month: ５
  birth_day: ２１
  address_first: 東京都千代田区神田
  address_second: ３丁目　４
  is_banchi_address: false
  address_go: １０
  address_apartment: | # 3行までであれば崩れず表現できます
    インチキタワー
    マンション
    ３６１０号室
  # この様式の住所欄には世帯主の氏名の行がないため、空欄のままにしてください。
  # This form's 住所 box has no 世帯主の氏名 row, so leave this empty.
  household_person: ''
  legally_domiciled_first: 東京都千代田区飯田橋
  legally_domiciled_second: ３丁目　４
  is_banchi_legally_domiciled: true
  head_of_person_of_legally_domiciled: 山田　太郎兵衛
  father_name: 山田　権左衛門
  mother_name: 山田　としこ
  relationship: 長
  marital_history:
    marriage_cat: 2 # 0: 初婚 1:死別 2:離別
    year: 令和3
    month: 6
    day: 1
  job_type: 6

wife:
  last_name: 貫井
  last_name_kana: ぬくい
  first_name: はゆ
  first_name_kana: はゆ
  birth_year: 平成7
  birth_month: 6
  birth_day: 6
  address_first: 東京都小金井市貫井北町
  address_second: ３丁目　４
  is_banchi_address: false
  address_go: １０
  address_apartment: |
    ""
  # 夫側と同じく、この様式には世帯主の氏名の行がありません。
  # Like the husband column, this form has no 世帯主の氏名 row.
  household_person: ''
  legally_domiciled_first: 神奈川県横浜市
  legally_domiciled_second: ３丁目　４
  is_banchi_legally_domiciled: true
  head_of_person_of_legally_domiciled: 貫井　パッパ
  father_name: 貫井　パッパ
  mother_name: 貫井　はよ
  relationship: 長
  marital_history:
    marriage_cat: 0 # 0: 初婚 1:死別 2:離別
    year: 令和３
    month: ６
    day: １
  job_type: 4

new_legally_domiciled:
  lastname_of: husband # husband / wife。外国人との婚姻の場合はnullで空欄に
  address: 東京都小金井市貫井北町１丁目１
  is_banchi_address: false

to_live_together:
  year: 令和3
  month: 6

national_census: # 国勢調査の年4/1-翌3/31に該当しない場合は記載不要。yearを空白文字""に
  year: 令和3
  husband_job: '03'
  wife_job: '02'

other: # 旧字体<=>新字体の変更などで使用。未成年婚姻のような同意欄の場合は直筆推奨で、必ず捺印を行うこと
  text: |
    ""
